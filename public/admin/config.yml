# ─── Backend ─────────────────────────────────────────────────
backend:
  name: github
  repo: Hauzknecht/nanofiber-web
  branch: master
  # These two lines are the fix — point auth at YOUR site, not Netlify
  base_url: https://nanofiber-web.pages.dev
  auth_endpoint: /api/auth

media_folder: "public/images/blog"
public_folder: "/images/blog"
site_url: https://nanofiber-web.pages.dev

# ─── Shared field definitions ────────────────────────────────
x-blog-fields: &blog-fields
  - label: "Title"
    name: "title"
    widget: "string"

  - label: "Publish Date"
    name: "date"
    widget: "datetime"
    format: "YYYY-MM-DD"
    date_format: "DD.MM.YYYY"
    time_format: false

  - label: "Short Summary (shown in blog list)"
    name: "excerpt"
    widget: "string"

  - label: "Category"
    name: "tag"
    widget: "select"
    options:
      - { label: "Research / Výzkum",     value: "Research"  }
      - { label: "Technical / Technické", value: "Technical" }
      - { label: "Industry / Průmysl",    value: "Industry"  }
      - { label: "News / Aktuality",      value: "News"      }

  - label: "Author"
    name: "author"
    widget: "string"
    default: "Jana Nováková"

  - label: "Translation slug (leave blank if filename is identical in both languages)"
    name: "translationSlug"
    widget: "string"
    required: false

  - label: "Cover Image"
    name: "coverImage"
    widget: "image"
    required: false

  - label: "Save as Draft (hide from site)"
    name: "draft"
    widget: "boolean"
    default: false

  - label: "Article Body"
    name: "body"
    widget: "markdown"

# ─── Collections ─────────────────────────────────────────────
collections:
  - name: "blog-en"
    label: "🇬🇧 Blog — English"
    label_singular: "English Post"
    folder: "src/content/blog-en"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields: *blog-fields

  - name: "blog-cs"
    label: "🇨🇿 Blog — Česky"
    label_singular: "Český příspěvek"
    folder: "src/content/blog-cs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields: *blog-fields
